# nginx reverse-proxy sozlamasi -- VPS'da Uvicorn (127.0.0.1:8000) oldida
# turadi: HTTPS, domen va statik fayllarni siqishni shu boshqaradi.
#
# O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/laminated_glasses
#   # Pastdagi "domen.uz" ni o'z domeningizga almashtiring (yoki install.sh
#   # buni avtomatik qiladi).
#   sudo ln -s /etc/nginx/sites-available/laminated_glasses /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d domen.uz -d www.domen.uz
#
# Certbot ishga tushgach, u ushbu faylga avtomatik SSL qatorlarini qo'shadi --
# keyin qo'lda tahrirlamang, certbot o'z blokini saqlab qoladi.

server {
    listen 80;
    listen [::]:80;
    server_name domen.uz www.domen.uz;

    # Katta rasm yuklashlarga ruxsat (konstruktor/mahsulot rasmlari).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # MUHIM: shu headerlar bo'lmasa, backend barcha so'rovlarni
        # 127.0.0.1 dan kelayotgandek ko'radi -- login bloki, honeypot va
        # rate-limit ishlamay qoladi (security.py TRUST_X_FORWARDED_FOR=auto
        # shu headerlarga shu proksi ishonchli bo'lgani uchun ishonadi).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
